
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIARE | Apoyo logístico</title>

    <link rel="stylesheet" href="login-apoyo-logistico.css">
</head>

<body>

    <div class="fondo">

        <main class="login-container">

            <div class="logo">
                <img src="logo-siare-solo.png" alt="Logo SIARE">
            </div>

            <div class="titulo">
                <h1>APOYO LOGÍSTICO</h1>
                <p>Sistema Integral de Administración de Restaurante Escolar</p>
            </div>

            <div class="separador"></div>

            <form action="apoyo-logistico.html" method="get">

                <h2>Bienvenido</h2>
                <p class="subtitulo">
                    Ingresa tus datos para continuar
                </p>

                <div class="campo">
                    <label for="usuario">Usuario</label>
                    <input
                     type="text"
                     id="usuario"
                      name="usuario"
                       placeholder="Usuario" required>
                       
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        required>
                </div>

                <div class="rol">
                    <span>Rol seleccionado</span>
                    <strong>Apoyo logístico</strong>
                </div>

                <button type="submit">
                    INICIAR SESIÓN
                </button>

                <a href="SIARE.html" class="volver">
                    Volver al inicio
                </a>

            </form>

            <footer>
                © 2026 SIARE - Restaurante Escolar
            </footer>

        </main>

    </div>

</body>
</html>
